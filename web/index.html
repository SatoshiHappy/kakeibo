<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#F3F4F2" media="(prefers-color-scheme: light)" data-scheme="light" />
    <meta name="theme-color" content="#121513" media="(prefers-color-scheme: dark)" data-scheme="dark" />
    <!-- 表 Y: この端末で選んだ明暗を最初の描画の前に当てる(src/lib/theme.ts と同じ規則)。中身を変えたら public/_headers の CSP の sha256 も変える -->
    <script>try{var v=localStorage.getItem('color-scheme');if(v==='light'||v==='dark'){document.querySelector('meta[name="color-scheme"]').content=v;document.querySelectorAll('meta[name="theme-color"]').forEach(function(m){m.media=m.dataset.scheme===v?'all':'not all'})}}catch(e){}</script>
    <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>家計簿</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
